name: FYONA CI

# Every push and pull request: the Business engine/conflict tests, the full
# regression suite, the backend relay/guard tests, and app builds for
# Android, iOS and Windows. Nothing here deploys anywhere.
on:
  push:
    branches: [main, develop, 'claude/**']
    paths-ignore: ['**.md', 'docs/**', 'continue*.txt']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  # The QA device-ledger build (same defines as the delivered QA APK).
  QA_DEFINES: >-
    --dart-define=FYONA_DIRECTORY_PILOT=true
    --dart-define=FYONA_DIRECTORY_PILOT_SIGNUP=true
    --dart-define=FYONA_BUSINESS_LEDGER_QA=true
    --dart-define=FYONA_BUSINESS_CASH_RELAY_QA=true
    --dart-define=FYONA_BUSINESS_EMPLOYEE_FINANCE_QA=true
    --dart-define=FYONA_DIRECTORY_ACCOUNT=b722efef-8a1c-4830-885b-3ad90492e837
    --dart-define=FYONA_DIRECTORY_ORG=0f683120-9e30-4876-ac15-6dd2decafaa6
    --dart-define=FYONA_DIRECTORY_BRANCH=da2e39ff-3990-4c16-863d-293fb902b93d

jobs:
  # What changed: app (Flutter) and/or server. Only the affected checks run;
  # the slow platform builds run only when the app itself changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.f.outputs.app }}
      backend: ${{ steps.f.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            app:
              - 'lib/**'
              - 'test/**'
              - 'assets/**'
              - 'pubspec.*'
              - 'android/**'
              - 'ios/**'
              - 'windows/**'
              - 'tools/ci/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'tools/ci/**'
              - '.github/workflows/ci.yml'

  business-tests:
    name: Business sync, conflicts, reports (Linux)
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze (errors fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - name: Two-device sync and conflict rules
        run: flutter test --no-pub $QA_DEFINES test/business_sync_engine_test.dart
      - name: Business, reports, money, employees, linked parties
        run: >-
          flutter test --no-pub $QA_DEFINES
          test/business_*_test.dart test/report_*_test.dart
          test/public_exchange_rates_test.dart test/peer_*_test.dart
          test/chat_media_store_test.dart
          test/sara_currency_mismatch_test.dart

  regression:
    name: Full regression suite (Linux)
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Every test in the app. Only failures listed in tools/ci/known_failures.txt
      # (pre-existing in the original project, outside the Business work) are
      # tolerated; any new failure anywhere fails the build.
      - name: All app tests (regression gate)
        # flutter exits 1 when any test fails (known ones too); the gate
        # decides. A crash with no results fails the gate (passed=0).
        run: |
          flutter test --no-pub --machine $QA_DEFINES test/ > results.jsonl || true
          python3 tools/ci/check_regressions.py < results.jsonl

  backend-tests:
    name: Backend relay, local mode, guard (PostgreSQL)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Relay, peer relay, local mode, write guard, QA ledger, party sharing
        run: >-
          tools/ci/backend_tests.sh
          backend/tests/unit/test_business_relay.py
          backend/tests/unit/test_business_peer_relay.py
          backend/tests/unit/test_business_local_mode.py
          backend/tests/unit/test_business_local_guard.py
          backend/tests/unit/test_business_local_migration.py
          backend/tests/unit/test_local_business_cutover.py
          backend/tests/unit/test_business_media_transit.py
          backend/tests/unit/test_qa_business_ledger.py
          backend/tests/unit/test_qa_business_party_sharing.py
          backend/tests/unit/test_sara_tool_contract.py

  android:
    name: Android build
    needs: business-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build QA APK (arm64, debug-signed)
        env:
          FYONA_DIRECTORY_PILOT_APK: '1'
          FYONA_DIRECTORY_PILOT_HTTPS: '1'
        run: >-
          flutter build apk --release --target-platform android-arm64 $QA_DEFINES
          --dart-define=FYONA_DIRECTORY_SETUP_URL=https://qa.fyonacompany.com:18443/api/v1
      - name: Size gate (< 35,000,000 bytes)
        run: |
          size=$(stat -c %s build/app/outputs/flutter-apk/app-release.apk)
          echo "APK size: $size"
          test "$size" -lt 35000000
      - uses: actions/upload-artifact@v4
        # The account's artifact quota can be full; the build itself passed.
        continue-on-error: true
        with:
          name: fyona-android-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  ios:
    name: iOS build + engine tests (macOS)
    needs: business-tests
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Sync engine and conflict rules on macOS
        run: flutter test --no-pub $QA_DEFINES test/business_sync_engine_test.dart test/peer_debt_views_test.dart test/public_exchange_rates_test.dart
      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign $QA_DEFINES

  windows:
    name: Windows build + engine tests
    needs: business-tests
    # Visual Studio 2022: VS 18 removed /await coroutines that plugins use.
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Sync engine and conflict rules on Windows
        shell: bash
        run: flutter test --no-pub $QA_DEFINES test/business_sync_engine_test.dart test/peer_debt_views_test.dart test/public_exchange_rates_test.dart
      - name: Build Windows
        shell: bash
        env:
          # The Firebase C++ SDK declares cmake_minimum_required < 3.5, which
          # CMake 4 rejects without this policy floor.
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: flutter build windows --release $QA_DEFINES
