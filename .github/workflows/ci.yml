name: FYONA CI

# Every push: analyze + the sync/conflict engine (fast gate) and the full
# regression suite (every test in test/, incl. the real-kill backup test).
# Windows-only checks run when their code changed. The slow platform builds
# (Android, iOS = macOS minutes at 10x, Windows at 2x) run on pull requests,
# on manual runs (release-apk.yml builds tagged releases), and on pushes that touch native code or
# dependencies — not on every Dart commit (release APKs are built and
# checked by tools/claude/fyona-6193-release-candidate.sh for every delivery).
# Nothing here deploys anywhere.
on:
  push:
    branches: [main, develop, 'claude/**']
    paths-ignore: ['**.md', 'docs/**', 'continue*.txt']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      builds:
        description: 'Build Android, iOS and Windows'
        type: boolean
        default: true
      heavy:
        description: 'Large backup restores (100 MB + 500 MB, with process kills)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  # The QA device-ledger build (same defines as the delivered QA APK).
  QA_DEFINES: >-
    --dart-define=FYONA_DIRECTORY_PILOT=true
    --dart-define=FYONA_DIRECTORY_PILOT_SIGNUP=true
    --dart-define=FYONA_BUSINESS_LEDGER_QA=true
    --dart-define=FYONA_BUSINESS_CASH_RELAY_QA=true
    --dart-define=FYONA_BUSINESS_EMPLOYEE_FINANCE_QA=true
    --dart-define=FYONA_DIRECTORY_ACCOUNT=b722efef-8a1c-4830-885b-3ad90492e837
    --dart-define=FYONA_DIRECTORY_ORG=0f683120-9e30-4876-ac15-6dd2decafaa6
    --dart-define=FYONA_DIRECTORY_BRANCH=da2e39ff-3990-4c16-863d-293fb902b93d

jobs:
  # What changed: app (Flutter) and/or server. Only the affected checks run;
  # the slow platform builds run only when the app itself changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.f.outputs.app }}
      backend: ${{ steps.f.outputs.backend }}
      printing: ${{ steps.f.outputs.printing }}
      backup: ${{ steps.f.outputs.backup }}
      native: ${{ steps.f.outputs.native }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            app:
              - 'lib/**'
              - 'test/**'
              - 'assets/**'
              - 'pubspec.*'
              - 'android/**'
              - 'ios/**'
              - 'windows/**'
              - 'tools/ci/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'tools/ci/**'
              - '.github/workflows/ci.yml'
            printing:
              - 'lib/features/printing/**'
              - 'test/printing/**'
              - 'windows/**'
            backup:
              - 'lib/core/backup/**'
              - 'lib/core/media/**'
              - 'lib/core/storage/**'
              - 'lib/core/services/media/**'
              - 'lib/features/core_business/data/local_ledger/business_local_backups.dart'
              - 'test/backup/**'
              - 'test/media/**'
              - 'lib/core/export/**'
              - 'test/export/**'
              - 'lib/core/import/**'
              - 'test/import/**'
              - 'lib/features/core_business/data/local_directory/**'
            native:
              - 'pubspec.*'
              - 'android/**'
              - 'ios/**'
              - 'windows/**'
              - '.github/workflows/ci.yml'

  # Fast gate: analyze + the two-device sync/conflict engine. Every other
  # Business test runs once, in the regression suite (no duplicate runs).
  business-tests:
    name: Analyze + sync/conflict engine (Linux)
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze (errors fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - name: Two-device sync and conflict rules
        run: flutter test --no-pub $QA_DEFINES test/business_sync_engine_test.dart

  regression:
    name: Full regression suite (Linux)
    needs: changes
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Every test in the app. Only failures listed in tools/ci/known_failures.txt
      # (pre-existing in the original project, outside the Business work) are
      # tolerated; any new failure anywhere fails the build.
      - name: All app tests (regression gate)
        # flutter exits 1 when any test fails (known ones too); the gate
        # decides. A crash with no results fails the gate (passed=0).
        env:
          FYONA_OS_KILL_TEST: '1' # backup survives a real SIGKILL (Linux)
        run: |
          flutter test --no-pub --machine $QA_DEFINES test/ > results.jsonl || true
          python3 tools/ci/check_regressions.py < results.jsonl

  # The Linux print tests are part of the regression suite; this job adds the
  # REAL Windows spooler, only when printing code changed (Windows = 2x).
  printing:
    name: Print Center (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.printing == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze the Print Center (errors fail)
        shell: bash
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/features/printing test/printing
      # A REAL printer in the Windows spooler ("Generic / Text Only" driver)
      # on a Standard TCP/IP port at 127.0.0.1:9100, where the test listens:
      # FYONA must find it (EnumPrinters) and print RAW through it.
      - name: Install a test printer in the Windows spooler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $driver = 'Generic / Text Only'
          if (-not (Get-PrinterDriver -Name $driver -ErrorAction SilentlyContinue)) { Add-PrinterDriver -Name $driver }
          Add-PrinterPort -Name 'FYONA_TEST_9100' -PrinterHostAddress '127.0.0.1' -PortNumber 9100
          Add-Printer -Name 'FYONA POS Test' -DriverName $driver -PortName 'FYONA_TEST_9100'
          Get-Printer | Format-Table Name, DriverName, PortName
          "FYONA_SPOOLER_PRINTER=FYONA POS Test" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Print engine, transports, IPP, discovery, page and motion
        shell: bash
        run: flutter test --no-pub $QA_DEFINES test/printing

  # Linux runs these tests in the regression suite (with the real-kill
  # test). Windows file semantics (rename, locks) are checked here, only
  # when backup / media / ledger code changed.
  backup-media:
    name: Backup v2 + media layer (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.backup == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze backup and media (errors fail)
        shell: bash
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/core/backup lib/core/media lib/core/storage lib/core/export lib/core/import test/backup test/media test/export test/import
      # Exact restore at 100 / 10k / 100k products, live capture, kill mid-backup,
      # tampering, recovery code, cloud outage, real Business + Personal ledgers.
      - name: Backup, restore, kill and tamper tests (measurements printed)
        shell: bash
        env:
          FYONA_OS_KILL_TEST: '1' # real SIGKILL test (runs on Linux only)
        run: flutter test --no-pub $QA_DEFINES -r expanded test/backup test/media test/export test/import | tee backup-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-measurements-${{ matrix.os }}
          path: backup-results.txt

  backend-tests:
    name: Backend relay, local mode, guard (PostgreSQL)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Relay, peer relay, local mode, write guard, QA ledger, party sharing
        run: >-
          tools/ci/backend_tests.sh
          backend/tests/unit/test_business_relay.py
          backend/tests/unit/test_business_peer_relay.py
          backend/tests/unit/test_business_local_mode.py
          backend/tests/unit/test_business_local_guard.py
          backend/tests/unit/test_business_local_migration.py
          backend/tests/unit/test_local_business_cutover.py
          backend/tests/unit/test_business_media_transit.py
          backend/tests/unit/test_storage_api.py
          backend/tests/unit/test_chat_cloud_media.py
          backend/tests/unit/test_import_mapping.py
          backend/tests/unit/test_backup_account_keys.py
          backend/tests/unit/test_qa_business_ledger.py
          backend/tests/unit/test_qa_business_party_sharing.py
          backend/tests/unit/test_sara_tool_contract.py
          backend/tests/unit/test_business_sara_device.py
          backend/tests/unit/test_falcon_device_dataset.py

  android:
    name: Android build
    needs: [changes, business-tests]
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.builds) ||
      (github.event_name == 'push' && needs.changes.outputs.native == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build QA APK (arm64, debug-signed)
        env:
          FYONA_DIRECTORY_PILOT_APK: '1'
          FYONA_DIRECTORY_PILOT_HTTPS: '1'
        run: >-
          flutter build apk --release --target-platform android-arm64 $QA_DEFINES
          --dart-define=FYONA_DIRECTORY_SETUP_URL=https://qa.fyonacompany.com:18443/api/v1
      - name: Size gate (< 36,000,000 bytes, same as the release guard)
        run: |
          size=$(stat -c %s build/app/outputs/flutter-apk/app-release.apk)
          echo "APK size: $size"
          test "$size" -lt 36000000
      - uses: actions/upload-artifact@v4
        # The account's artifact quota can be full; the build itself passed.
        continue-on-error: true
        with:
          name: fyona-android-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  ios:
    name: iOS build + engine tests (macOS)
    needs: [changes, business-tests]
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.builds) ||
      (github.event_name == 'push' && needs.changes.outputs.native == 'true')
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Sync engine and conflict rules on macOS
        run: flutter test --no-pub $QA_DEFINES test/business_sync_engine_test.dart test/peer_debt_views_test.dart test/public_exchange_rates_test.dart
      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign $QA_DEFINES

  windows:
    name: Windows build + engine tests
    needs: [changes, business-tests]
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.builds) ||
      (github.event_name == 'push' && needs.changes.outputs.native == 'true')
    # Visual Studio 2022: VS 18 removed /await coroutines that plugins use.
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Sync engine and conflict rules on Windows
        shell: bash
        run: flutter test --no-pub $QA_DEFINES test/business_sync_engine_test.dart test/peer_debt_views_test.dart test/public_exchange_rates_test.dart
      - name: Build Windows
        shell: bash
        env:
          # The Firebase C++ SDK declares cmake_minimum_required < 3.5, which
          # CMake 4 rejects without this policy floor.
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: flutter build windows --release $QA_DEFINES

  # Manual only: real-size continuous-backup restores on a new device
  # (two branches, photos, invoices), with SIGKILLs mid-restore.
  heavy-backup:
    name: Large backup restores (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.heavy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore 100 MB and 500 MB backups (kills included)
        env:
          FYONA_LARGE_RESTORE: '100,500'
          FYONA_LARGE_KILLS: '2'
          FYONA_LARGE_DIR: ${{ runner.temp }}/fyona-large
        run: |
          export FYONA_QA_DEFINES="$QA_DEFINES"
          flutter test --no-pub $QA_DEFINES -r expanded test/backup/backup_large_restore_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: large-restore-report
          path: ${{ runner.temp }}/fyona-large/large-restore-report.txt
