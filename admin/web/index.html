<!DOCTYPE html>
<html lang="ar" dir="rtl" data-lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FYONA Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════
   FYONA ADMIN — Premium Dark Financial Dashboard
   Identity: Deep Black + Deep Red  ·  Mobile First  ·  RTL/LTR ready
   ════════════════════════════════════════════════════════════════ */

/* ── 1. Design Tokens ─────────────────────────────────────────── */
:root{
  /* surfaces */
  --bg:#0B0B0D; --surface:#151518; --card:#1B1B1F; --card-hover:#222227; --surface-2:#1E1E22; --surface-3:#26262C;
  /* brand — deep red, used sparingly */
  --primary:#B1122A; --primary-hover:#D01835; --primary-dark:#7F0C1D; --primary-soft:rgba(177,18,42,.14); --primary-glow:rgba(177,18,42,.35);
  /* text */
  --text:#F5F5F5; --text-2:#9A9AA3; --text-3:#6E6E78; --text-disabled:#55555C;
  /* status */
  --ok:#2E9E5B; --ok-bg:rgba(46,158,91,.15);
  --warn:#C9A227; --warn-bg:rgba(201,162,39,.14);
  --danger:#E5484D; --danger-bg:rgba(229,72,77,.13); --danger-soft:#7F0C1D;
  /* borders & misc */
  --border:#2A2A30; --border-soft:rgba(255,255,255,.07); --divider:#222227;
  --radius:14px; --radius-sm:10px; --radius-lg:18px; --radius-pill:99px;
  --shadow:0 14px 34px rgba(0,0,0,.45); --shadow-sm:0 6px 18px rgba(0,0,0,.35);
  /* spacing scale (4-based) */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px; --sp-8:40px; --sp-9:48px;
  /* type scale */
  --fs-xs:11px; --fs-sm:12.5px; --fs-base:14px; --fs-md:15.5px; --fs-lg:17px; --fs-xl:20px; --fs-2xl:24px;
  --lh-tight:1.35; --lh-base:1.6; --lh-loose:1.85;
  /* layout */
  --sidebar-w:272px; --header-h:62px; --drawer-w:302px; --maxw:1500px;
  --headings:'Cairo','Inter',sans-serif;
}
html[data-lang="en"]{ --headings:'Inter','Cairo',sans-serif; }

/* ── 2. Reset & base ──────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Cairo','Inter',sans-serif;font-size:var(--fs-base);line-height:var(--lh-base);overflow:hidden;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;font-size:var(--fs-sm);line-height:1.4;outline:none;width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:var(--text-3)}
label{display:block;font-size:var(--fs-xs);color:var(--text-2);margin-bottom:6px;font-weight:600}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#3a3a42;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
::selection{background:var(--primary-soft)}

/* ── 3. Typography system ─────────────────────────────────────── */
h1,.h1{font-size:var(--fs-xl);font-weight:800}
h2,.h2{font-size:var(--fs-lg);font-weight:800}
h3,.h3{font-size:var(--fs-md);font-weight:700}
.txt-2{color:var(--text-2)} .txt-3{color:var(--text-3)}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wb{word-break:break-word;overflow-wrap:anywhere}

/* ── 4. Icons (SVG sprite set) ────────────────────────────────── */
.ic{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;color:currentColor}
.ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ── 5. Buttons ───────────────────────────────────────────────── */
.btn,.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--radius-sm);font-weight:700;font-size:var(--fs-sm);padding:11px 18px;min-height:44px;transition:background .15s,border-color .15s,transform .08s,box-shadow .15s;user-select:none;-webkit-tap-highlight-color:transparent}
.btn{width:100%}
.btn:active,.tbtn:active{transform:scale(.97)}
.btn:disabled,.tbtn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 4px 14px var(--primary-glow)}
.btn:hover{background:linear-gradient(135deg,var(--primary-hover),var(--primary-dark));box-shadow:0 6px 18px var(--primary-glow)}
.btn.ghost,.tbtn.norm{background:var(--surface-3);color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover,.tbtn.norm:hover{background:var(--card-hover);color:#fff}
.tbtn.ok{background:var(--ok-bg);color:var(--ok);border:1px solid rgba(46,158,91,.3)}
.tbtn.ok:hover{background:rgba(46,158,91,.24)}
.tbtn.danger{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(229,72,77,.3)}
.tbtn.danger:hover{background:rgba(229,72,77,.24)}
.tbtn.warn{background:var(--warn-bg);color:var(--warn);border:1px solid rgba(201,162,39,.3)}
.btn.block{width:100%}
.btn.sm,.tbtn.sm{padding:7px 12px;min-height:36px;font-size:var(--fs-xs)}
.icon-btn{width:42px;height:42px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);font-size:var(--fs-lg);transition:.15s}
.icon-btn:hover{background:var(--card-hover);color:var(--text);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.94)}

/* ── 6. Badges & tags ─────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:var(--radius-pill);font-size:var(--fs-xs);font-weight:700;white-space:nowrap;min-height:24px}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.pending,.badge.in_progress{background:var(--warn-bg);color:var(--warn)}
.badge.approved,.badge.completed,.badge.active,.badge.paid{background:var(--ok-bg);color:var(--ok)}
.badge.rejected,.badge.banned,.badge.failed,.badge.expired{background:var(--danger-bg);color:var(--danger)}
.badge.cancelled,.badge.deleted,.badge.inactive{background:rgba(140,140,150,.14);color:var(--text-2)}
.badge.trial{background:var(--primary-soft);color:#ff9aa8}
.tag{display:inline-flex;align-items:center;font-size:var(--fs-xs);color:var(--text-2);background:var(--surface-2);padding:3px 9px;border-radius:6px;margin-inline-start:4px;white-space:nowrap}

/* ── 7. Cards & sections ──────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;min-width:0;max-width:100%;transition:background .15s}
.card h3{font-size:var(--fs-md);font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0;padding:0 2px}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:0 0 auto}
.card>*{max-width:100%}
.card table,.card .bank-deck,.card .grid2,.card .row,.card .proof-grid,.card .toggles,.card .filterbar{max-width:100%}
.section{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.section h2{color:var(--text);font-size:var(--fs-md);font-weight:800}
.section .muted{margin-inline-start:8px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-width:0}
.panel-head .title{display:flex;align-items:center;gap:9px;min-width:0}
.panel-head .title h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0}
.panel-head .title .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:0 0 auto}
.panel-head .tools{display:flex;gap:8px;flex-wrap:wrap}

/* ── 8. Page structure / app shell ────────────────────────────── */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;background:radial-gradient(circle at 50% 22%,#2a0f1c 0%,#0B0B0D 72%)}
#app{display:none;height:100vh;max-width:100vw;overflow:hidden;flex-direction:row}

/* Sidebar (desktop) — DOM first child → sits at inline-start logical edge */
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,var(--surface),#121216);border:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:100%;overflow-y:auto;z-index:10}
.sb-logo{display:flex;align-items:center;gap:11px;padding:16px 16px 12px;border-bottom:1px solid var(--border);min-width:0}
.sb-logo .brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1;cursor:pointer}
.logo-mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;box-shadow:0 4px 14px var(--primary-glow)}
.logo-mark svg{width:24px;height:24px}
.sb-logo b{font-size:17px;letter-spacing:.2px;white-space:nowrap}
.sb-logo small{display:block;color:var(--text-3);font-size:10.5px;margin-top:1px}
.sb-user{display:flex;align-items:center;gap:10px;padding:12px 14px;margin:0 8px 4px;border-radius:var(--radius-sm);background:var(--surface-2);min-width:0}
.sb-user .avatar{font-size:13px}
.sb-user .su{flex:1;min-width:0}
.sb-user b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user small{color:var(--text-3);font-size:10.5px}
.sb-nav{flex:1;overflow-y:auto;padding:12px 10px 8px}
.sb-group{color:var(--text-3);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:13px 10px 6px;display:flex;align-items:center;gap:8px}
.sb-group::before{content:'';width:14px;height:1px;background:var(--border);flex:0 0 auto}
.sb-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--radius-sm);color:var(--text-2);font-weight:600;font-size:var(--fs-sm);cursor:pointer;margin-bottom:3px;transition:background .15s,color .15s;min-width:0;-webkit-tap-highlight-color:transparent}
.sb-item .ic{color:var(--text-3);flex:0 0 auto}
.sb-item span[data-txt]{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .nav-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;background:var(--primary);color:#fff;font-size:10px;font-weight:800;padding:0 5px;flex:0 0 auto;box-shadow:0 2px 8px var(--primary-glow)}
.sb-item:hover{background:var(--surface-2);color:var(--text)}
.sb-item.active{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.sb-item.active .ic{color:#fff}
.sb-footer{padding:12px 14px;border-top:1px solid var(--border);background:var(--surface)}
.sb-footer b{color:var(--text-2);display:block;font-size:11.5px;margin-bottom:6px}

/* Header */
.topbar{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;flex-shrink:0;min-width:0;position:sticky;top:0;z-index:30}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0}
.tb-title{display:flex;flex-direction:column;min-width:0}
.tb-title h1{font-size:var(--fs-md);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.tb-title .sub{color:var(--text-3);font-size:var(--fs-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{display:flex;align-items:center;gap:9px;flex-shrink:0}
.avatar-chip{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0;box-shadow:0 3px 12px var(--primary-glow)}
.bell-badge{position:absolute;top:3px;inset-inline-start:22px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--surface);z-index:2}
#bellBtn{position:relative}
.bell-filters{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--border)}
.bell-list{overflow-y:auto;padding:6px 8px;min-width:0}
.bell-item{display:flex;gap:10px;padding:10px 8px;border-radius:var(--radius-sm);cursor:pointer;min-width:0;align-items:flex-start;border:2px solid var(--primary);margin-bottom:8px;background:var(--card)}
.bell-item:hover{background:var(--card-hover);transform:translateY(-1px);box-shadow:0 4px 14px rgba(177,18,42,.2)}
.bell-item .notif-ic{width:36px;height:36px;font-size:15px}
.online-dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px rgba(46,158,91,.6);flex:0 0 auto;animation:pulseOnline 2s infinite}
.online-label{font-size:11px;color:var(--ok);font-weight:700}
@keyframes pulseOnline{0%,100%{opacity:1}50%{opacity:.5}}
.chat-head-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.sug-send-btn{width:44px;height:44px;min-width:44px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%}
.sug-replybar .icon-btn.recording{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulseRec 1s infinite}
@keyframes pulseRec{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.1)}}

/* Main content */
.main{flex:1;height:100%;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 22px 72px;min-width:0;max-width:100%;scroll-behavior:smooth}

/* ── 9. Drawer (mobile) — direction-aware via html[dir] ───────── */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;display:none;opacity:0;transition:opacity .22s}
.drawer-overlay.open{display:block;opacity:1}
#appDrawer{position:fixed;top:0;bottom:0;width:var(--drawer-w);max-width:86vw;background:linear-gradient(180deg,var(--surface),#121216);border:1px solid var(--border);z-index:45;display:flex;flex-direction:column;overflow-y:auto;box-shadow:0 18px 60px rgba(0,0,0,.6);transition:transform .28s cubic-bezier(.4,0,.2,1)}
html[dir="ltr"] #appDrawer{left:0;transform:translateX(-104%)}
html[dir="ltr"] #appDrawer.open{transform:translateX(0)}
html[dir="rtl"] #appDrawer{right:0;transform:translateX(104%)}
html[dir="rtl"] #appDrawer.open{transform:translateX(0)}
.drawer-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--border);min-width:0}
.drawer-header .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.drawer-header b{font-size:16px;white-space:nowrap}
.drawer-header small{display:block;color:var(--text-3);font-size:10.5px}
.drawer-user{display:flex;align-items:center;gap:9px;padding:10px 14px;margin:0 8px 4px;background:var(--surface-2);border-radius:var(--radius-sm);min-width:0}
.drawer-nav{flex:1;overflow-y:auto;padding:12px 10px 8px}
.drawer-footer{padding:12px 14px;border-top:1px solid var(--border)}

/* ── 10. Mobile header (drawer + compact) ─────────────────────── */
@media (max-width:900px){
  .sidebar{display:none}
  .hamburger{display:inline-flex}
  .content{padding:16px 14px 10px}
  .topbar{height:56px;padding:0 12px}
}
@media (min-width:901px){ .hamburger{display:none} }

/* ── 11. Stats / KPI ──────────────────────────────────────────── */
.row{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-width:0;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.kpi.gold::before{background:var(--warn)}
.kpi.green::before{background:var(--ok)}
.kpi.red::before{background:var(--danger)}
.kpi.primary::before{background:var(--primary)}
.kpi.ok::before{background:var(--ok)}
.kpi.warn::before{background:var(--warn)}
.kpi.info::before{background:#4A7DFF}
.kpi .v{font-size:24px;font-weight:800;line-height:1.1;color:var(--text);letter-spacing:.2px}
.kpi .l{color:var(--text-3);font-size:11.5px;margin-top:6px}
.kpi .icon{position:absolute;inset-block-end:14px;inset-inline-end:14px;width:34px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--text-2);display:flex;align-items:center;justify-content:center}
@media (max-width:560px){ .row{grid-template-columns:1fr 1fr;gap:12px} .kpi{padding:13px} .kpi .v{font-size:19px} }

/* ── 12. Tables (desktop) + Mobile Cards (data-label) ─────────── */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;border-radius:var(--radius-sm);border:1px solid var(--border-soft)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
thead th{color:var(--text-3);text-align:start;font-size:var(--fs-xs);padding:10px 13px;border-bottom:1px solid var(--border);font-weight:700;white-space:nowrap}
tbody td{padding:12px 13px;border-bottom:1px solid var(--divider);vertical-align:middle;color:var(--text);line-height:1.45}
tbody tr:hover td{background:var(--card-hover)}
tbody tr:last-child td{border-bottom:0}
tbody td.numeric{direction:ltr;text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:767px){
  table.tbl-mobile thead{display:none}
  table.tbl-mobile tr{display:block;margin-bottom:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-sm);padding:2px}
  table.tbl-mobile td{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;border:0;border-bottom:1px solid var(--border-soft);min-width:0}
  table.tbl-mobile td::before{content:attr(data-label);font-size:10.5px;color:var(--text-3);font-weight:700;white-space:nowrap;flex:0 0 auto}
  table.tbl-mobile td:last-child{border-bottom:0}
  table.tbl-mobile td.is-empty{display:flex;flex-direction:column;gap:2px;justify-content:center;text-align:center;padding:24px 12px}
  table.tbl-mobile td.is-empty::before{content:none}
  table.tbl-mobile .actions-cell{flex-direction:row;justify-content:flex-start;flex-wrap:wrap;gap:6px}
  table.tbl-mobile .actions-cell::before{content:attr(data-label)}
}

/* ── 13. Forms / filters ──────────────────────────────────────── */
.mfield{margin-bottom:15px;min-width:0}
.mfield label{font-size:11.5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
@media (max-width:640px){ .grid2{grid-template-columns:minmax(0,1fr)} .grid2>*,.detail-grid>*,.grid2>.sub-detail,.detail-grid>.sub-detail{min-width:0} }
.filterbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;min-width:0}
.filterbar input,.filterbar select{width:auto;min-width:140px;flex:0 0 auto}
.filterbar .btn{width:auto;padding:10px 18px;font-size:var(--fs-sm)}
@media (max-width:640px){
  .filterbar{flex-direction:column;align-items:stretch}
  .filterbar input,.filterbar select{width:100%}
  .filterbar .btn{width:100%}
}
select,textarea{padding:11px 13px}
textarea{resize:vertical;min-height:96px}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
input:disabled,select:disabled,textarea:disabled{opacity:.5;cursor:not-allowed}

/* ── 14. Modal (centered on desktop / bottom sheet on mobile) ─── */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:90;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px}
.modal.open{display:flex}
.modal-box{width:520px;max-width:96vw;max-height:92vh;min-width:0;overflow-y:auto;background:linear-gradient(180deg,var(--surface),#121216);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow);animation:modalIn .16s ease}
.modal-box.wide{width:680px;max-width:98vw}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
body.modal-open{overflow:hidden!important}
.modal-box h3{font-size:var(--fs-md);font-weight:800;margin-bottom:16px;word-break:break-word;display:flex;align-items:center;gap:8px}
.modal-head-row{display:flex;align-items:center;gap:12px;margin-bottom:2px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.modal-head-row h3{margin-bottom:0;flex:1;min-width:0}
.back-btn{flex:0 0 auto;width:40px;height:40px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);font-size:var(--fs-lg);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.back-btn:hover{background:var(--card-hover);color:var(--text);transform:scale(1.04)}
.m-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.m-actions .btn{flex:1 1 auto;min-width:0}
@media (max-width:767px){
  .modal{align-items:flex-end;padding:0}
  .modal::before{content:'';width:40px;height:4px;border-radius:3px;background:var(--border);position:absolute;inset-block-start:10px;inset-inline-end:50%;transform:translateX(50%)}
  .modal-box{width:100%;max-width:100%;max-height:94vh;border-radius:18px 18px 0 0;padding:22px 16px 26px;border-bottom:none}
  .m-actions{flex-direction:column}
  .m-actions .btn{width:100%}
  .modal-head-row{position:sticky;top:0;z-index:6;margin:-22px -16px 0;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);border-radius:0} 
}

/* ── 15. Details / proofs / request panels ────────────────────── */
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin:10px 0}
.detail-grid .k{color:var(--text-3);font-size:var(--fs-xs)}
.detail-grid .v{font-weight:700;color:var(--text);word-break:break-word;min-width:0}
.req-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;margin-bottom:14px;background:linear-gradient(135deg,var(--primary-soft),transparent);border:1px solid var(--primary-glow);border-radius:var(--radius);flex-wrap:wrap;min-width:0}
.req-head .rh-user{display:flex;align-items:center;gap:12px;min-width:0}
.req-head .rh-user .avatar{width:46px;height:46px;font-size:17px}
.req-head b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.req-head .muted{font-size:12px}
.req-id{font-family:monospace;background:rgba(0,0,0,.35);border:1px solid var(--border);color:var(--text-2);padding:4px 11px;border-radius:8px;font-size:11px;direction:ltr;white-space:nowrap}
.req-amount{font-size:22px;font-weight:800;color:var(--text);direction:ltr;text-align:start;font-variant-numeric:tabular-nums}
.sub-detail{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;min-width:0;display:flex;flex-direction:column;gap:9px}
.sub-detail .k{color:var(--text-3);font-size:11px;font-weight:700}
.sub-detail .v{font-weight:800;color:var(--text);word-break:break-word;min-width:0}
.msg-quote{background:var(--surface-2);border-inline-start:3px solid var(--primary);padding:10px 14px;border-radius:var(--radius-sm);font-size:var(--fs-sm);color:var(--text-2);margin-top:8px;line-height:var(--lh-loose);min-width:0;word-break:break-word}
.proof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:12px;margin-top:10px}
.proof-cell{position:relative;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);background:var(--surface-2);aspect-ratio:4/3;cursor:zoom-in}
.proof-cell img{width:100%;height:100%;object-fit:cover;display:block}
.proof-cell .pc-type{position:absolute;bottom:6px;inset-inline-end:6px;background:rgba(0,0,0,.72);color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:7px}
.proof{max-width:100%;border-radius:var(--radius-sm);margin-top:8px;border:1px solid var(--border)}

/* ── 16. Bank deck (responsive horizontal cards) ──────────────── */
.bank-deck{position:relative;display:flex;align-items:center;gap:10px;min-width:0}
.bank-track{flex:1;overflow-x:auto;overflow-y:hidden;padding:6px 2px 14px;display:flex;gap:18px;scroll-snap-type:x proximity;scrollbar-width:thin;-webkit-overflow-scrolling:touch;min-width:0}
.bank-track::-webkit-scrollbar{height:8px}
.bank-grid-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;padding:6px 0 14px}
.bank-pro{flex:1 1 0;border-radius:var(--radius);padding:18px 20px;position:relative;
  background:linear-gradient(145deg,#1B1B1F 0%,#2A0A10 40%,#B1122A 100%);color:#fff;min-width:0;
  border:2px solid rgba(177,18,42,.5);transition:all .18s;overflow:hidden}
.bank-pro::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 10%,rgba(177,18,42,.15),transparent 60%);pointer-events:none}
.bank-pro:hover{box-shadow:0 8px 24px rgba(177,18,42,.35);transform:translateY(-2px);border-color:var(--primary)}
.bank-pro .bp-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2;min-width:0}
.bank-pro .bp-name{font-size:16px;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:#fff}
.bank-pro .bp-holder{font-size:11px;color:rgba(255,255,255,.65);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bank-pro .bp-bankico{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid rgba(255,255,255,.25);flex:0 0 auto}
.bank-pro .bp-balance{margin-top:16px;position:relative;z-index:2;min-width:0}
.bank-pro .bp-balance .lbl{font-size:10px;color:rgba(255,255,255,.6);letter-spacing:.6px;text-transform:uppercase}
.bank-pro .bp-balance .val{font-size:27px;font-weight:800;font-family:inherit;color:#fff;white-space:nowrap;direction:ltr}
.bank-pro .bp-cur{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap;position:relative;z-index:2;min-width:0}
.bank-pro .bp-cur .chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:3px 11px;border-radius:var(--radius-pill);font-size:10.5px;font-weight:700;letter-spacing:.3px;cursor:pointer;transition:.15s;white-space:nowrap;color:rgba(255,255,255,.7)}
.bank-pro .bp-cur .chip:hover{background:rgba(255,255,255,.22);color:#fff}
.bank-pro .bp-cur .chip.primary,.bank-pro .bp-cur .chip.active{background:#fff;color:var(--primary);border-color:#fff;font-weight:800}
.bp-cur-switch{display:inline-flex;align-items:center;gap:7px;margin-top:10px;position:relative;z-index:2;min-width:0}
.bp-arrow-sm{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:15px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.bp-arrow-sm:hover{background:#fff;color:var(--primary);border-color:#fff}
.bp-currency{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:4px 15px;border-radius:var(--radius-pill);font-size:12px;font-weight:800;min-width:66px;justify-content:center;color:#fff}
.bank-pro .bp-foot{display:flex;gap:8px;margin-top:15px;position:relative;z-index:2;flex-wrap:wrap}
.bank-pro .bp-foot .tbtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);padding:8px 12px;font-size:12px}
.bank-pro .bp-foot .tbtn:hover{background:#fff;color:var(--primary);border-color:#fff}
.bank-arrow{flex:0 0 auto;width:44px;height:44px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:19px;display:flex;align-items:center;justify-content:center;transition:.15s}
.bank-arrow:hover{background:var(--card-hover);color:#fff;transform:scale(1.05)}
.bank-arrow:disabled{opacity:.3;cursor:not-allowed;transform:none}
.bank-count{text-align:center;color:var(--text-3);font-size:11px;margin-top:2px}
.bank-pro .bp-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;position:relative;z-index:2}
.bank-pro .bp-chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.85);padding:4px 11px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer}
.bank-pro .bp-chip.on{background:rgba(255,255,255,.2);border-color:#fff;color:#fff}
.bank-pro .bp-sys{display:inline-block;background:rgba(127,255,139,.18);border:1px solid rgba(127,255,139,.5);color:#7fff8b;padding:1px 9px;border-radius:var(--radius-pill);font-size:10px;font-weight:800;vertical-align:middle}
.curr-chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;padding:5px 13px;border-radius:var(--radius-pill);font-size:12px;font-weight:700;white-space:nowrap}
.carousel-dots{display:flex;gap:6px;justify-content:center;margin-top:4px}
@media (max-width:767px){ .bank-pro{padding:16px} .bank-pro .bp-balance .val{font-size:22px} .bank-grid-wrap{grid-template-columns:1fr} }

/* ── 16b. Stacked bank deck (one card over the other, swipe to switch) ── */
.bank-stack{position:relative;min-width:0}
.bank-deck-top{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.bank-deck-top .bp-arrow-sm{width:34px;height:34px}
.bank-deck-cur{min-width:96px;text-align:center;font-weight:800;font-size:13px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-pill);padding:7px 16px}
.bank-viewport{overflow-x:auto;scroll-snap-type:x mandatory;display:flex;gap:14px;padding:8px 4px 12px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.bank-viewport::-webkit-scrollbar{height:8px}
.bank-viewport .bank-pro{flex:0 0 84%;scroll-snap-align:center;scroll-snap-stop:always;cursor:pointer}
.bank-viewport .bank-pro.active{border-color:var(--primary);box-shadow:0 10px 30px rgba(177,18,42,.4)}
.bank-viewport .bank-pro .bp-cur-switch{display:none}
@media (min-width:900px){ .bank-viewport .bank-pro{flex-basis:52%} }
@media (max-width:560px){ .bank-viewport .bank-pro{flex-basis:92%} }
.bank-dots{display:flex;gap:6px;justify-content:center;margin:2px 0 6px}
.bank-dots .bdot{width:8px;height:8px;border-radius:50%;background:var(--border);cursor:pointer;transition:.15s}
.bank-dots .bdot.on{background:var(--primary);box-shadow:0 0 8px var(--primary-glow);transform:scale(1.25)}

/* ── 16c. Analytics bars ── */
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:flex;align-items:center;gap:10px;min-width:0}
.bar-lbl{flex:0 0 86px;font-size:11px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;min-width:0;height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary-dark),var(--primary));min-width:3px}
.bar-val{flex:0 0 auto;font-size:11.5px;font-weight:800;min-width:52px;text-align:end}
@media (max-width:560px){ .bar-lbl{flex-basis:64px} .grid2{grid-template-columns:1fr} }
/* ── Growth chart (users over time) ── */
.gx-wrap{position:relative;width:100%}
.gx-svg{width:100%;height:auto;display:block;direction:ltr}
.gx-grid{stroke:rgba(255,255,255,.09);stroke-width:1}
.gx-yl{fill:var(--text-2);font-size:10px}
.gx-xl{fill:var(--text-2);font-size:10.5px}
.gx-line{stroke:var(--primary);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.gx-dot{fill:#0d0d12;stroke:var(--primary);stroke-width:2.5;cursor:pointer}
.gx-dot:hover{fill:var(--primary);r:6}
.gx-tip{position:absolute;z-index:5;pointer-events:none;background:#14141c;border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12px;line-height:1.9;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.5);white-space:nowrap}

/* ── 16d. Bank statement view ── */
.stmt-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.stmt-back{width:40px;height:40px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:17px;cursor:pointer;flex:0 0 auto}
.stmt-back:hover{background:var(--card-hover)}
.stmt-cur{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:8px;min-width:0}
.stmt-cur .cc{font-weight:800;font-size:13px;min-width:64px}
.stmt-cur .cb{margin-inline-start:auto;text-align:end;font-size:12px;color:var(--text-2)}
.stmt-cur .cb b{display:block;color:var(--text);font-size:14px}
.stmt-sec{font-size:13px;font-weight:800;margin:16px 0 8px;color:var(--text)}
.stmt-row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;cursor:pointer;min-width:0}
.stmt-row:hover{background:var(--card-hover)}
.stmt-row .tx-ic{flex:0 0 auto}
.stmt-row .tx-mid{min-width:0}
.stmt-user{font-size:11px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid var(--divider);font-size:13px;min-width:0}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text-2)}
.kv .v{font-weight:700;text-align:end;word-break:break-word}

/* ── 17. Toggles / switches ───────────────────────────────────── */
.toggles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.toggle{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);padding:13px 14px;border-radius:var(--radius-sm);min-width:0}
.toggle b{font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toggle small{color:var(--text-3);display:block}
.switch{position:relative;width:46px;height:25px;background:#333340;border-radius:var(--radius-pill);display:inline-flex;cursor:pointer;transition:background .2s;flex:0 0 auto}
.switch.on{background:var(--primary)}
.switch::after{content:'';position:absolute;top:3px;inset-inline-end:3px;width:19px;height:19px;background:#fff;border-radius:50%;transition:inset-inline-end .2s}
html[dir="ltr"] .switch::after{left:3px}
html[dir="ltr"] .switch.on::after{left:24px}
.switch.on::after{inset-inline-end:24px}
@media (max-width:640px){ .toggles{grid-template-columns:minmax(0,1fr)} }

/* ── 18. Banner editor (unchanged functional behavior) ────────── */
.banner-stage-wrap{position:relative;min-width:0}
.banner-stage{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:16/5.4;overflow:hidden;border-radius:16px;touch-action:none;user-select:none;cursor:grab;box-shadow:0 14px 40px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.08);transition:background .3s ease}
.banner-stage:active{cursor:grabbing}
.banner-media{position:absolute;top:0;left:0;will-change:transform;outline:1px dashed rgba(255,255,255,.55);outline-offset:-1px;cursor:grab;max-width:100%}
.banner-media video,.banner-media img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.resize-h{position:absolute;width:16px;height:16px;background:#fff;border:2px solid var(--primary);border-radius:4px;z-index:6}
.resize-h.corner-nw{top:-7px;left:-7px;cursor:nwse-resize}
.resize-h.corner-ne{top:-7px;right:-7px;cursor:nesw-resize}
.resize-h.corner-sw{bottom:-7px;left:-7px;cursor:nesw-resize}
.resize-h.corner-se{bottom:-7px;right:-7px;cursor:nwse-resize}
.banner-dim{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
.banner-dim .dim-label{font-size:11px;color:var(--text-3)}
.banner-dim input[type=range]{flex:1;min-width:120px;width:auto;padding:0;height:6px;accent-color:var(--primary)}
.banner-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.banner-tools .tbtn{background:var(--surface-2);border:1px solid var(--border)}
.banner-ctrl-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
.bctrl{display:flex;align-items:center;gap:10px;min-width:0}
.bctrl>span{flex:0 0 auto;font-size:12px;color:var(--text-2);font-weight:700;min-width:90px}
.bctrl input[type=range]{flex:1;min-width:0;width:auto;padding:0;height:8px;accent-color:var(--primary);cursor:pointer}
.bctrl .bval{flex:0 0 auto;width:52px;text-align:center;font-size:12px;font-weight:700;color:var(--text);background:var(--surface-2);border-radius:8px;padding:4px 6px;border:1px solid var(--border)}
.banner-editor-tip{font-size:11px;color:var(--text-3);margin-top:6px;text-align:center}
/* ── 18b. Live banner controls: text inputs with circular color dots ── */
.blive-ctrls{margin-top:12px;display:grid;gap:12px}
.brow{display:flex;gap:10px;align-items:center}
.brow>input{flex:1;min-width:0}
.cdots{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:0 0 auto;max-width:46%}
.cdot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.25);transition:transform .15s ease,box-shadow .15s ease;flex:0 0 auto}
.cdot:hover{transform:scale(1.18)}
.cdot.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--primary);border-color:#fff}
.cdot.custom{background:conic-gradient(red,orange,yellow,green,#1b7ad4,indigo,violet,red)}
input[type=color].native-hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.banner-stage{max-width:100%}
.banner-tools .tbtn{min-height:40px}
@media (pointer:coarse){
  .resize-h{width:24px;height:24px}
  .resize-h.corner-nw{top:-11px;left:-11px}
  .resize-h.corner-ne{top:-11px;right:-11px}
  .resize-h.corner-sw{bottom:-11px;left:-11px}
  .resize-h.corner-se{bottom:-11px;right:-11px}
  .banner-tools .tbtn{min-height:44px;font-size:13px}
  .bctrl input[type=range]{height:28px}
}

/* ── 19. Suggestions / chat ───────────────────────────────────── */
.sug-layout{display:flex;gap:0;height:calc(100vh - 130px);min-height:400px;min-width:0}
.sug-side{width:320px;flex:0 0 auto;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.sug-search{padding:12px 12px 6px}
.sug-filters{display:flex;gap:6px;padding:8px 12px 10px;flex-wrap:wrap}
.sug-chip{font-size:11.5px;font-weight:600;padding:7px 12px;border-radius:var(--radius-pill);background:var(--surface-2);color:var(--text-2);border:1px solid var(--border);transition:.15s}
.sug-chip:hover{background:var(--card-hover);color:var(--text)}
.sug-chip.on{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-color:transparent}
.sug-users{flex:1;overflow-y:auto}
.sug-user{display:flex;gap:10px;padding:12px;cursor:pointer;border-bottom:1px solid var(--divider);align-items:center;transition:.12s;min-width:0}
.sug-user:hover{background:var(--card-hover)}
.sug-user.active{background:linear-gradient(90deg,var(--primary-soft),transparent);border-inline-start:3px solid var(--primary)}
.sug-user .avatar{width:40px;height:40px;font-size:15px}
.su-mid{flex:1;min-width:0}
.su-top{display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0}
.su-top b{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.su-time{font-size:10px;color:var(--text-3);flex:0 0 auto}
.su-sub{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:3px;min-width:0}
.su-preview{color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.unread{flex:0 0 auto;min-width:19px;height:19px;border-radius:10px;background:var(--primary);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.su-status{margin-top:2px}
.su-status .badge{font-size:9px;padding:2px 7px}
.sug-main{flex:1;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.sug-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-3);padding:24px;text-align:center}
.sug-empty b{color:var(--text);font-size:15px}
.se-badge{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:6px;box-shadow:0 14px 34px var(--primary-glow)}
.sug-chat{flex:1;overflow-y:auto;padding:16px;background:radial-gradient(circle at 50% 20%,#1a1416,#0B0B0D)}
.bub{display:flex;margin:6px 0}
.bub.in{justify-content:flex-start}
.bub.out{justify-content:flex-end}
.bub-body{max-width:76%;padding:10px 13px;border-radius:15px;font-size:var(--fs-sm);line-height:var(--lh-loose);word-break:break-word;box-shadow:0 4px 14px rgba(0,0,0,.35);min-width:0}
.bub.in .bub-body{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-top-right-radius:4px}
.bub.out .bub-body{background:var(--surface-3);border-top-left-radius:4px;color:#d7d7d7}
.bub-title{display:block;margin-bottom:5px;font-size:12.5px;color:#ffd9dd}
.bub-meta{font-size:10px;margin-top:5px;text-align:start;opacity:.85}
.bub.out .bub-meta{color:var(--text-3)}
.bub.in .bub-body .bub-meta{color:rgba(255,255,255,.75)}
.bub-foot{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.bub-status{width:auto;min-width:92px;padding:3px 7px;font-size:10.5px;border-radius:8px;background:rgba(0,0,0,.25);color:#fff;border:1px solid rgba(255,255,255,.22)}
.bub-img{max-width:190px;max-height:150px;border-radius:10px;margin-top:7px;display:block;cursor:zoom-in;border:1px solid rgba(255,255,255,.14)}
.sug-audio{display:flex;gap:9px;align-items:center;margin-top:7px;border-radius:12px;padding:8px 12px;min-width:230px}
.sug-audio.out{background:linear-gradient(120deg,rgba(74,125,255,.13),rgba(74,125,255,.04));border:1px solid rgba(125,155,255,.28)}
.sug-audio.in{background:linear-gradient(120deg,rgba(255,77,109,.16),rgba(255,77,109,.05));border:1px solid rgba(255,120,140,.3)}
.sug-audio-btn{width:38px;height:38px;min-width:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(177,18,42,.25);transition:transform .12s}
.sug-audio-btn:active{transform:scale(.9)}
.sug-audio-btn svg{width:17px;height:17px;fill:#fff}
.sug-audio-wave{display:flex;align-items:center;gap:2.5px;flex:1;min-width:110px;height:32px}
.sug-audio-wave span{width:3px;border-radius:1.5px;background:rgba(125,155,255,.5);transition:background .15s}
.sug-audio.out .sug-audio-wave span.played{background:#7d9bff}
.sug-audio.in .sug-audio-wave span.played{background:#ff5d77}
.sug-audio-time{font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.sug-audio-time small{display:block;font-size:9px;color:var(--text-3);font-weight:500}
.sug-replybar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:var(--surface);align-items:center;min-width:0}
.sug-replybar input{background:var(--surface-2);flex:1;min-width:0;padding:10px 14px;border-radius:var(--radius-pill);border:1px solid var(--border);font-size:var(--fs-sm)}
.sug-replybar input:focus{border-color:var(--primary)}
.sug-replybar .icon-btn{width:40px;height:40px;min-width:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.sug-back{display:none;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:0 13px;height:40px;font-size:18px;flex:0 0 auto}
@media (max-width:940px){
  .sug-layout{height:auto;flex-direction:column;min-height:0}
  .sug-side{width:100%;border-left:none;border-bottom:1px solid var(--border)}
  .sug-users{max-height:52vh}
  .sug-user{padding:14px 12px}
  .sug-main{min-height:60vh}
  /* Full-screen chat overlay when a conversation is open */
  .sug-layout.chat-open .sug-side{display:none}
  .sug-layout.chat-open .sug-main{position:fixed;inset:0;z-index:70;background:var(--bg);min-height:0;height:100vh;height:100dvh}
  .sug-layout.chat-open .chat-head{padding:10px 12px;min-height:60px}
  .sug-layout.chat-open .sug-chat{flex:1;padding:12px 10px calc(12px + env(safe-area-inset-bottom,0px))}
  #sugBackBtn{display:flex!important}
  .bub-body{max-width:88%;font-size:14px}
  .bub-img{max-width:min(230px,70vw);max-height:180px}
  .sug-replybar{padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));gap:10px;position:sticky;bottom:0;background:var(--surface)}
  .sug-replybar input{padding:12px 16px;font-size:15px}
  .sug-replybar .icon-btn{width:46px;height:46px;min-width:46px}
  .sug-send-btn{width:50px!important;height:50px!important;min-width:50px!important}
}
/* Pending attachment chip above the reply bar */
.attach-chip{display:none;align-items:center;gap:10px;margin:0 12px 8px;padding:9px 12px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--primary);font-size:12.5px;color:var(--text);min-width:0}
.attach-chip.show{display:flex}
.attach-chip .a-ic{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:17px}
.attach-chip .a-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.attach-chip .a-x{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--surface-3);border:1px solid var(--border);color:var(--text);font-size:14px;cursor:pointer}
/* Voice recording timer badge */
.voice-timer{display:none;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#ff5b6a;font-variant-numeric:tabular-nums;white-space:nowrap}
.voice-timer.show{display:inline-flex}
.voice-timer .rec-dot{width:9px;height:9px;border-radius:50%;background:#ff3b4d;animation:pulseRec 1s infinite}
.sug-replybar .icon-btn.recording{background:var(--danger);color:#fff;border-color:var(--danger)}

/* ── 20. Chat rows / notifications list ───────────────────────── */
.chat-row{display:flex;gap:10px;padding:13px;border-bottom:1px solid var(--divider);cursor:pointer;align-items:center;min-width:0}
.chat-row:hover{background:var(--card-hover)}
.chat-row .cr-main{flex:1;min-width:0}
.chat-row b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ── 21. Avatar ───────────────────────────────────────────────── */
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0}

/* ── 22. Lightbox ─────────────────────────────────────────────── */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:120;display:none;align-items:center;justify-content:center;padding:18px;cursor:zoom-out}
.lightbox.open{display:flex}
.lb-box{position:relative;max-width:96vw;max-height:94vh;width:fit-content;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.lb-close{position:absolute;top:10px;inset-inline-start:10px;z-index:5;width:38px;height:38px;border-radius:12px;background:rgba(0,0,0,.65);color:#fff;font-size:17px;border:1px solid rgba(255,255,255,.25);cursor:pointer}
.lb-content{display:flex;align-items:center;justify-content:center;overflow:auto;max-width:96vw;max-height:94vh;min-width:220px;min-height:130px;background:#0a0a0a}
.lb-content img{max-width:100%;max-height:92vh;display:block;object-fit:contain}
.lb-content iframe{width:90vw;height:88vh;border:none;background:#fff;border-radius:0 0 16px 16px}
.lb-content .lb-empty{color:#aaa;padding:30px;font-size:13px;text-align:center}

/* ── 23. Toast ────────────────────────────────────────────────── */
.toast{position:fixed;bottom:24px;inset-inline-start:24px;background:var(--ok-bg);color:var(--ok);padding:13px 18px;border-radius:12px;font-weight:700;z-index:100;display:none;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:92vw;pointer-events:none}
.toast.err{background:var(--danger-soft);color:#ffd7da}

/* ── 24. Empty / loading / error states ───────────────────────── */
.empty{text-align:center;color:var(--text-3);padding:38px 14px;line-height:var(--lh-loose);display:flex;flex-direction:column;align-items:center;gap:8px;min-height:120px}
.empty .em-ic{width:52px;height:52px;border-radius:14px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-3);margin-bottom:2px}
.skeleton{position:relative;overflow:hidden;background:var(--surface-2);border-radius:var(--radius-sm);min-height:120px}
.skeleton::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:shimmer 1.1s infinite}
.skeleton .sk-row{height:14px;border-radius:6px;background:#24242A;margin:14px 12px}
@keyframes shimmer{from{transform:translateX(-20%)}to{transform:translateX(20%)}}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-inline-start:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-row{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--text-3);padding:20px}

/* ── 25. Miscellaneous helpers ────────────────────────────────── */
.muted{color:var(--text-3);font-size:12px}
.back-btn,button[data-icon]{font-size:inherit}
.dot{width:8px;height:8px;border-radius:50%;background:#444;cursor:pointer}
.dot.on{background:var(--primary)}
img,video{max-width:100%}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* ── 26. Extra responsive guards ──────────────────────────────── */
@media (max-width:480px){
  .tb-actions{gap:6px}
  .content{padding:14px 12px 10px}
  .login-box{width:94%}
  .filterbar input,.filterbar select{width:100%}
}

/* ── 27. Login ────────────────────────────────────────────────── */
.login-box{width:400px;max-width:94vw;background:linear-gradient(180deg,var(--surface),#121216);border:1px solid var(--border);border-radius:var(--radius-lg);padding:34px 30px;box-shadow:0 24px 70px rgba(0,0,0,.65);animation:modalIn .2s ease}
.login-box .logo{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:22px}
.login-box .logo-mark{width:48px;height:48px;border-radius:13px}
.login-box .logo-text{font-size:22px;font-weight:900;letter-spacing:.3px}
.login-box .logo-text small{display:block;font-size:11px;color:var(--text-3);font-weight:600;text-align:center}
.login-title{text-align:center;font-size:17px;font-weight:800;margin-bottom:6px}
.login-sub{text-align:center;color:var(--text-3);font-size:12px;margin-bottom:22px;line-height:1.6}
.err{background:var(--danger-bg);border:1px solid rgba(229,72,77,.4);color:#ff9aa3;padding:10px 13px;border-radius:var(--radius-sm);font-size:12px;margin-bottom:12px;display:none;line-height:1.5}

/* ════════════════════════════════════════════════════════════════
   28. FYONA UI v2 — visual distinction system
   - Status-accent cards   - Semantic colors per state
   - Bank grid (no clipping) - Transaction list - User rows
   - Role badges - Chat header - Notification feed - Tabs - Plan cards
   ════════════════════════════════════════════════════════════════ */

/* Semantic status accents */
.card.ok{border-top:3px solid var(--ok)}
.card.warn{border-top:3px solid var(--warn)}
.card.danger{border-top:3px solid var(--danger)}
.card.info{border-top:3px solid #4A7DFF}
.card.tint-ok{background:linear-gradient(180deg,var(--ok-bg),transparent 42%),var(--card)}
.card.tint-warn{background:linear-gradient(180deg,var(--warn-bg),transparent 42%),var(--card)}
.card.tint-danger{background:linear-gradient(180deg,var(--danger-bg),transparent 42%),var(--card)}
.card.tint-info{background:linear-gradient(180deg,rgba(74,125,255,.10),transparent 42%),var(--card)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.status-dot.ok{background:var(--ok);box-shadow:0 0 8px rgba(46,158,91,.6)}
.status-dot.warn{background:var(--warn);box-shadow:0 0 8px rgba(201,162,39,.5)}
.status-dot.danger{background:var(--danger);box-shadow:0 0 8px rgba(229,72,77,.55)}
.status-dot.info{background:#4A7DFF;box-shadow:0 0 8px rgba(74,125,255,.5)}
.status-dot.muted{background:var(--text-3)}

/* Role badges */
.role-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:var(--radius-pill);white-space:nowrap}
.role-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.role-badge.super_admin,.role-badge.owner{background:var(--primary-soft);color:#ff9aa8}
.role-badge.admin{background:rgba(74,125,255,.14);color:#9db4ff}
.role-badge.employee{background:var(--ok-bg);color:var(--ok)}
.role-badge.support{background:var(--warn-bg);color:var(--warn)}
.role-badge.manager{background:rgba(168,140,255,.14);color:#c0b1ff}
.role-badge.viewer,.role-badge.user{background:rgba(140,140,150,.14);color:var(--text-2)}
.role-badge.accountant{background:rgba(0,200,180,.14);color:#5fd8cc}

/* Tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px;margin-bottom:16px}
.tab-btn{flex:1 1 auto;padding:9px 14px;border-radius:8px;font-size:var(--fs-sm);font-weight:700;color:var(--text-2);text-align:center;transition:.15s;white-space:nowrap;cursor:pointer}
.tab-btn:hover{color:var(--text);background:var(--card-hover)}
.tab-btn.on{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 3px 10px var(--primary-glow)}
@media (max-width:560px){ .tab-btn{font-size:12px;padding:8px 10px} }

/* ── Banks: responsive GRID (no clipped cards, no horizontal scroll) ── */
.bank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;min-width:0;margin-top:4px}
@media (max-width:400px){ .bank-grid{grid-template-columns:minmax(0,1fr)} }
.bank-grid .bank-pro{width:100%;max-width:100%;min-height:0}
.bank-rows{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.bank-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-sm);padding:8px 12px;min-width:0}
.bank-row .br-cur{font-weight:800;font-size:12.5px}
.bank-row .br-bal{direction:ltr;font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px}

/* ── Transaction / operations list ── */
.tx-list{display:flex;flex-direction:column;min-width:0}
.tx-row{display:flex;align-items:center;gap:13px;padding:12px 6px;border-bottom:1px solid var(--divider);min-width:0}
.tx-row:hover{background:var(--card-hover)}
.tx-row:last-child{border-bottom:0}
.tx-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:18px}
.tx-ic.in{background:var(--ok-bg);color:var(--ok)}
.tx-ic.out{background:var(--danger-bg);color:var(--danger)}
.tx-ic.info{background:rgba(74,125,255,.14);color:#7d9bff}
.tx-ic.warn{background:var(--warn-bg);color:var(--warn)}
.tx-mid{flex:1;min-width:0}
.tx-title{font-size:13.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:11px;color:var(--text-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tx-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;min-width:0}
.tx-amt{font-weight:800;font-size:14px;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-amt.in{color:var(--ok)}
.tx-amt.out{color:var(--danger)}
.tx-amt.neutral{color:var(--text)}
.tx-badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}

/* ── User rows (list style) ── */
.user-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--divider);min-width:0;cursor:pointer;transition:background .14s}
.user-row:hover{background:var(--card-hover)}
.user-row:last-child{border-bottom:0}
.avatar-sm{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex:0 0 auto}.um-trunc{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.user-td{min-width:0}
.u-mini{display:flex;align-items:center;gap:9px;min-width:0}
.u-mini b{white-space:normal;word-break:break-word;overflow-wrap:anywhere;line-height:1.35}
.u-mini .avatar-sm{flex:0 0 auto}
.tx-chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.staff-card{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius);border:2px solid var(--primary);margin-bottom:10px;min-width:0;cursor:pointer;transition:all .18s;background:var(--card)}
.staff-card:hover{background:var(--card-hover);transform:translateY(-2px);box-shadow:0 8px 24px rgba(177,18,42,.2)}

/* ── Chat header (suggestions) ── */
.chat-head{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);min-width:0;flex:0 0 auto}
.chat-head .avatar{width:44px;height:44px;font-size:16px}
.chat-head .ch-info{flex:1;min-width:0}
.chat-head b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.chat-head .ch-sub{font-size:11px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-sel{width:auto;min-width:0;padding:7px 10px;font-size:12px;font-weight:700;border-radius:var(--radius-pill);background:var(--surface);border:1px solid var(--border);flex:0 0 auto}
.status-sel option{background:var(--surface)}
.chat-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bub-sender{display:block;font-size:10px;font-weight:800;letter-spacing:.3px;margin-bottom:3px}
.bub-sender.admin{color:#ffd9dd}
.bub-sender.user{color:#9db4ff}
.day-divider{display:flex;align-items:center;gap:10px;margin:14px 0 8px;color:var(--text-3);font-size:10.5px}
.day-divider::before,.day-divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── Notification feed (admin center) ── */
.notif-feed{display:flex;flex-direction:column;min-width:0}
.notif-item{display:flex;gap:12px;padding:12px 6px;border-bottom:1px solid var(--divider);align-items:flex-start;min-width:0;border-radius:var(--radius-sm)}
.notif-item:hover{background:var(--card-hover)}
.notif-item:last-child{border-bottom:0}
.notif-ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:17px}
.notif-ic.kind-ok{background:var(--ok-bg);color:var(--ok)}
.notif-ic.kind-warn{background:var(--warn-bg);color:var(--warn)}
.notif-ic.kind-danger{background:var(--danger-bg);color:var(--danger)}
.notif-ic.kind-info{background:rgba(74,125,255,.14);color:#7d9bff}
.notif-item.unread{background:linear-gradient(90deg,var(--primary-soft),transparent 70%)}
.notif-item.unread .n-title{color:#fff}
.notif-mid{flex:1;min-width:0}
.n-title{font-weight:700;font-size:13.5px;color:var(--text)}
.n-desc{font-size:12px;color:var(--text-2);margin-top:2px;min-width:0;word-break:break-word}
.n-meta{font-size:10.5px;color:var(--text-3);margin-top:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.n-dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--primary);flex:0 0 auto;margin-top:3px}

/* Subscription summary in user detail */
.sub-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:4px 0 14px}
.sub-cell{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;min-width:0}
.sub-cell .k{font-size:10.5px;color:var(--text-3);font-weight:700}
.sub-cell .v{font-size:14px;font-weight:800;color:var(--text);margin-top:3px;min-width:0;word-break:break-word}
.sub-cell .v.ok{color:var(--ok)} .sub-cell .v.warn{color:var(--warn)} .sub-cell .v.danger{color:var(--danger)}
@media (max-width:560px){ .sub-summary{grid-template-columns:minmax(0,1fr)} }

/* Permission groups */
.perm-group{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;background:var(--surface);min-width:0}
.perm-group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.perm-group-head b{font-size:13px}
.perm-group .toggles{gap:8px}
.perm-group .toggle{padding:7px 11px;border-radius:8px}

/* Plan cards */
.plan-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.plan-card{border:1px solid var(--border);border-radius:var(--radius);padding:18px;background:var(--card);min-width:0;display:flex;flex-direction:column;gap:10px}
.plan-card .pc-name{font-size:15px;font-weight:800}
.plan-card .pc-ar{display:flex;gap:8px;flex-wrap:wrap}
.plan-card .pc-muted{font-size:12px}
.plan-card .pc-price{font-size:18px;font-weight:800}
.plan-card .pc-peiod{font-size:12px;color:var(--text-3)}
.banner-row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--divider);flex-wrap:wrap;min-width:0}
.banner-row:last-child{border-bottom:0}
.search-inline{display:flex;gap:8px;flex-wrap:wrap}
.search-inline input{flex:1;min-width:150px}

@media (max-width:767px){
  .tx-row{gap:10px}
  .tx-ic{width:38px;height:38px;font-size:16px}
  .chat-head{border-radius:0}
}
/* ── 29. Bank grid + User cards + Chat enhancements ──────── */
.user-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:4px}
.user-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border:2px solid var(--primary);border-radius:var(--radius);cursor:pointer;transition:all .18s;min-width:0}
.user-card:hover{background:var(--card-hover);transform:translateY(-2px);box-shadow:0 8px 24px rgba(177,18,42,.2)}
.uc-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;flex:0 0 auto}
.uc-info{flex:1;min-width:0}
.uc-name{font-weight:700;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uc-serial{font-size:12px;color:var(--text-3);margin-top:3px;direction:ltr}
.uc-arrow{color:var(--text-3);font-size:18px;flex:0 0 auto}
.bub-del{position:absolute;top:4px;inset-inline-end:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:11px;display:none;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.bub.out:hover .bub-del{display:flex}
.bub.out{position:relative}
.bub-read{font-size:10px;margin-top:3px;display:flex;align-items:center;gap:4px}
.bub-read.read{color:var(--ok)}
.bub-read.unread{color:var(--text-3)}
.sug-layout{display:flex;gap:0;height:calc(100vh - 130px);min-height:400px}
.sug-side{width:320px;flex:0 0 auto;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sug-main{flex:1;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.sug-layout.chat-open .sug-side{display:none}
@media (max-width:640px){ .user-card-grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M5 4 L5 20 M5 4 L19 4 M19 4 L19 20 M5 12 L19 12" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/><circle cx="14.5" cy="9" r="2.4" fill="#fff"/></svg></div>

        <div style="flex:1;min-width:0"><b>FYONA</b><small>لوحة الإدارة</small></div>
      </div>
    </div>

          <span class="bell-badge" id="bellBadge" style="display:none">0</span>
