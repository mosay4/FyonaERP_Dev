# Keep resource usage bounded on development hosts with limited memory.
# No long-lived daemon: RAM is released after each build. Incremental/Gradle
# caching stays ON (never `flutter clean`).
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.configureondemand=true
# Single-use daemon: no filesystem watching overhead.
org.gradle.vfs.watch=false
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
systemProp.http.socketTimeout=600000
systemProp.http.connectionTimeout=600000
android.useAndroidX=true
android.enableJetifier=true
# Explicitly retain AGP 8's default R8 full mode for release shrinking.
android.enableR8.fullMode=true
# Use Google Play Services' on-demand barcode model instead of bundling the
# ML Kit model in the APK (keeps the release under Telegram's 50MB limit).
dev.steenbakker.mobile_scanner.useUnbundled=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
workmanager.enableDataSyncForegroundService=true
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx3072m -XX:MaxMetaspaceSize=768m
# Two workers allow plugin tasks to run in parallel without unbounded concurrency.
org.gradle.workers.max=2
org.gradle.parallel=true
