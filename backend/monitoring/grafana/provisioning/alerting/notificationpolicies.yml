# ── Grafana Alerting: Notification Policy ──
# Routes alerts to the appropriate contact points based on severity.

apiVersion: 1

policies:
  - orgId: 1
    receiver: admin-email
    group_by: ["alertname", "service"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Critical alerts → email + Telegram immediately
      - receiver: telegram-alerts
        matchers:
          - severity = "critical"
        group_wait: 10s
        repeat_interval: 1h
      # Warning alerts → email only
      - receiver: admin-email
        matchers:
          - severity = "warning"
        repeat_interval: 4h
