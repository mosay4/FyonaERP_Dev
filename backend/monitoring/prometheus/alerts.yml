# ── Prometheus Alert Rules ──
# Groups: API, Database, Redis, System, Backup

groups:
  # ══════════════════════════════════════════════════════════════════════
  #  API Alerts
  # ══════════════════════════════════════════════════════════════════════
  - name: api_alerts
    rules:
      # API completely down (no scrapes for 1 minute)
      - alert: APIDown
        expr: up{job="fyona-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: fyona-api
        annotations:
          summary: "FYONA API is DOWN"
          description: "API has been unreachable for over 1 minute."

      # High error rate (> 5% of requests are 5xx)
      - alert: APIHighErrorRate
        expr: |
          (
            sum(rate(http_errors_total{status=~"5.."}[5m])) by (endpoint)
            /
            sum(rate(http_requests_total[5m])) by (endpoint)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          service: fyona-api
        annotations:
          summary: "High 5xx error rate on {{ $labels.endpoint }}"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)."

      # Slow responses (p95 latency > 2s)
      - alert: APISlowResponses
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, endpoint)
          ) > 2
        for: 5m
        labels:
          severity: warning
          service: fyona-api
        annotations:
          summary: "Slow API responses on {{ $labels.endpoint }}"
          description: "p95 latency is {{ $value | humanizeDuration }} (threshold: 2s)."

      # Very slow responses (p99 latency > 5s)
      - alert: APIVerySlowResponses
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, endpoint)
          ) > 5
        for: 5m
        labels:
          severity: critical
          service: fyona-api
        annotations:
          summary: "Very slow API responses on {{ $labels.endpoint }}"
          description: "p99 latency is {{ $value | humanizeDuration }} (threshold: 5s)."

  # ══════════════════════════════════════════════════════════════════════
  #  Database Alerts
  # ══════════════════════════════════════════════════════════════════════
  - name: database_alerts
    rules:
      # PostgreSQL down
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          service: postgresql
        annotations:
          summary: "PostgreSQL is DOWN"
          description: "PostgreSQL instance has been unreachable for over 1 minute."

      # Too many connections (> 80% of max)
      - alert: PostgreSQLHighConnections
        expr: |
          sum(pg_stat_activity_count) /
          (SELECT setting::int FROM pg_settings WHERE name = 'max_connections') > 0.8
        for: 5m
        labels:
          severity: warning
          service: postgresql
        annotations:
          summary: "PostgreSQL connection count is high"
          description: "Connection usage is {{ $value | humanizePercentage }} (threshold: 80%)."

      # Database size > 10GB
      - alert: PostgreSQLLargeDatabase
        expr: pg_database_size_bytes > 10737418240
        for: 5m
        labels:
          severity: warning
          service: postgresql
        annotations:
          summary: "PostgreSQL database is large"
          description: "Database size is {{ $value | humanize1024 }}B (threshold: 10GB)."

  # ══════════════════════════════════════════════════════════════════════
  #  Redis Alerts
  # ══════════════════════════════════════════════════════════════════════
  - name: redis_alerts
    rules:
      # Redis down
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is DOWN"
          description: "Redis instance has been unreachable for over 1 minute."

      # High memory usage (> 100MB)
      - alert: RedisHighMemory
        expr: redis_memory_used_bytes > 104857600
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis is using {{ $value | humanize1024 }}B (threshold: 100MB)."

      # Low hit rate (< 80%)
      - alert: RedisLowHitRate
        expr: |
          redis_keyspace_hits_total /
          (redis_keyspace_hits_total + redis_keyspace_misses_total) < 0.8
        for: 10m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis cache hit rate is low"
          description: "Hit rate is {{ $value | humanizePercentage }} (threshold: 80%)."

  # ══════════════════════════════════════════════════════════════════════
  #  System Alerts
  # ══════════════════════════════════════════════════════════════════════
  - name: system_alerts
    rules:
      # Disk space < 20% free
      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.2
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "Disk space is low"
          description: "Only {{ $value | humanizePercentage }} of disk is free (threshold: 20%)."

      # Disk space < 5% free (CRITICAL)
      - alert: DiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.05
        for: 1m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Disk space is CRITICALLY low"
          description: "Only {{ $value | humanizePercentage }} of disk is free (threshold: 5%)."

      # High memory usage (> 90%)
      - alert: HighMemoryUsage
        expr: |
          (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "Memory usage is high"
          description: "Memory usage is {{ $value | humanizePercentage }} (threshold: 90%)."

      # High CPU usage (> 90% for 10 minutes)
      - alert: HighCPUUsage
        expr: |
          100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "CPU usage is high"
          description: "CPU usage is {{ $value | humanizePercentage }} (threshold: 90%)."

      # System load > 2x CPU count
      - alert: HighSystemLoad
        expr: |
          node_load15 / count without (cpu) (
            node_cpu_seconds_total{mode="idle"}
          ) > 2
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "System load is very high"
          description: "Load average is {{ $value | humanize }} (threshold: 2x CPU count)."

      # Container restarted in last hour
      - alert: ContainerRestarted
        expr: |
          increase(container_restart_count[1h]) > 0
        for: 0m
        labels:
          severity: warning
          service: docker
        annotations:
          summary: "Container {{ $labels.name }} restarted"
          description: "Container has restarted {{ $value }} time(s) in the last hour."

  # ══════════════════════════════════════════════════════════════════════
  #  Celery Alerts
  # ══════════════════════════════════════════════════════════════════════
  - name: celery_alerts
    rules:
      # Celery worker down (no scrape for 2 minutes)
      - alert: CeleryWorkerDown
        expr: up{job="fyona-celery"} == 0
        for: 2m
        labels:
          severity: critical
          service: celery
        annotations:
          summary: "Celery worker is DOWN"
          description: "Celery worker has been unreachable for over 2 minutes."

      # Task failure rate > 10%
      - alert: CeleryHighFailureRate
        expr: |
          (
            sum(rate(celery_task_failed_total[5m])) by (name)
            /
            sum(rate(celery_task_total[5m])) by (name)
          ) > 0.1
        for: 5m
        labels:
          severity: warning
          service: celery
        annotations:
          summary: "High Celery task failure rate: {{ $labels.name }}"
          description: "Failure rate is {{ $value | humanizePercentage }} (threshold: 10%)."

      # Task queue depth > 100
      - alert: CeleryQueueBacklog
        expr: celery_queue_length > 100
        for: 5m
        labels:
          severity: warning
          service: celery
        annotations:
          summary: "Celery queue backlog"
          description: "Queue {{ $labels.queue }} has {{ $value }} pending tasks (threshold: 100)."
