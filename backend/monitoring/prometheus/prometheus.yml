# ── Prometheus Configuration ──
# Scrapes: FYONA API, node-exporter, cAdvisor, postgres_exporter, redis_exporter, self

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# ── Alert rules ──
rule_files:
  - /etc/prometheus/alerts.yml

# ── Scrape targets ──
scrape_configs:
  # ── FYONA API (via Docker network) ──
  - job_name: "fyona-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["fyona-api:8000"]
        labels:
          service: "fyona-api"
          environment: "production"

  # ── Node Exporter (host metrics) ──
  - job_name: "node-exporter"
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          service: "node-exporter"

  # ── cAdvisor (Docker container metrics) ──
  - job_name: "cadvisor"
    static_configs:
      - targets: ["127.0.0.1:8080"]
        labels:
          service: "cadvisor"

  # ── PostgreSQL Exporter ──
  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["127.0.0.1:9187"]
        labels:
          service: "postgres-exporter"

  # ── Redis Exporter ──
  - job_name: "redis-exporter"
    static_configs:
      - targets: ["127.0.0.1:9121"]
        labels:
          service: "redis-exporter"

  # ── Prometheus self-monitoring ──
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          service: "prometheus"
