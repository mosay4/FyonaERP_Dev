# aaPanel Reverse Proxy Config for FYONA ERP API
# Instructions:
# 1. In aaPanel → Website → Add Site (domain: api.yourdomain.com)
# 2. Go to Website → Reverse Proxy → Add
# 3. Target URL: http://127.0.0.1:8000
# 4. Then replace the automatically generated config with this one
#
# This file goes in: /www/server/panel/vhost/nginx/api.yourdomain.com.conf
# (or paste the location block into aaPanel's site config editor)

upstream fyona_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.yourdomain.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    # SSL — managed by aaPanel Let's Encrypt
    ssl_certificate    /www/server/panel/vhost/cert/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # SSL session cache — reduces handshake overhead for repeated visitors
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Gzip compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/plain
        text/css
        text/javascript
        text/xml
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Prometheus metrics — restrict to internal only
    location /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://fyona_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy to FastAPI
    # NOTE: /uploads/* requests are NOT served statically by Nginx.
    # They reach the FastAPI `files.py` endpoint which enforces
    # authentication + per-category authorization (admin, owner, etc.).
    location / {
        proxy_pass http://fyona_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # IMPORTANT: overwrite X-Forwarded-For with the real client IP instead
        # of appending ($proxy_add_x_forwarded_for). The app's rate limiter and
        # uvicorn (--forwarded-allow-ips 127.0.0.1) trust this header because
        # the direct peer is loopback; overwriting here prevents clients from
        # spoofing their IP to rotate past per-IP rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_buffering off;

        # Upload limit
        client_max_body_size 100M;
        client_body_buffer_size 128k;
    }

    # Deny access to sensitive paths
    location ~ /\.(env|git|venv|py) {
        deny all;
        return 404;
    }

    # Access & error logs
    access_log /www/wwwlogs/api.yourdomain.com.log;
    error_log  /www/wwwlogs/api.yourdomain.com.error.log;
}
